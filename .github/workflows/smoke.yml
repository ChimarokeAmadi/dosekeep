name: Production smoke test

# After each merge to main, Vercel builds and deploys production. This waits until the
# live site reports the merged commit (from /api/health), then checks that it works.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Wait for the new deployment
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the APP_URL repository secret."; exit 1; fi
          for i in $(seq 1 60); do
            COMMIT=$(curl -fsS "$APP_URL/api/health" | jq -r '.commit // empty' || true)
            if [ "$COMMIT" = "$GITHUB_SHA" ]; then echo "Live: $COMMIT"; exit 0; fi
            echo "Waiting for $GITHUB_SHA (live: ${COMMIT:-unknown})"; sleep 10
          done
          echo "The deployment did not go live within 10 minutes"; exit 1
      - name: Health check (app and database)
        run: curl -fsS "$APP_URL/api/health"
      - name: Pages respond
        run: |
          curl -fsS -o /dev/null "$APP_URL/"
          curl -fsS -o /dev/null "$APP_URL/login"
      - name: Cron endpoint refuses requests without the secret
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/cron/reminders")" = "401"
