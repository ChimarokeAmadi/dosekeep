name: Production smoke test

# Runs after Vercel reports a successful production deployment.
on: deployment_status

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Health check (app and database)
        run: |
          URL="${{ github.event.deployment_status.environment_url }}"
          curl -fsS --retry 5 --retry-delay 5 "$URL/api/health"
      - name: Pages respond
        run: |
          URL="${{ github.event.deployment_status.environment_url }}"
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/cron/reminders")" = "401"
